<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraStream</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: #161b22;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 85%;
            max-width: 360px;
            border: 1px solid #30363d;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 24px;
            color: #58a6ff;
        }
        p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .status {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            background: #21262d;
            color: #3fb950;
            margin-bottom: 24px;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #238636;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 12px;
        }
        button.stop {
            background-color: #da3633;
        }
        button.secondary {
            background-color: #1f6feb;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>UltraStream</h1>
        <p>Remote Screen Mirroring Service</p>
        <div class="status" id="statusText">Service Ready</div>
        <button onclick="startStream()">Start Streaming</button>
        <button class="stop" onclick="stopStream()">Stop Streaming</button>
        <button class="secondary" onclick="openAccessibility()">Enable Auto-Accept</button>
    </div>

    <script>
        function startStream() {
            document.getElementById('statusText').innerText = 'Starting Stream...';
            if (window.AndroidBridge) {
                window.AndroidBridge.startScreenMirror();
            }
        }
        function stopStream() {
            document.getElementById('statusText').innerText = 'Stream Stopped';
            if (window.AndroidBridge) {
                window.AndroidBridge.stopScreenMirror();
            }
        }
        function openAccessibility() {
            if (window.AndroidBridge) {
                window.AndroidBridge.openAccessibilitySettings();
            }
        }
    </script>
</body>
</html>
